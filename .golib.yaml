schema_version: 1
tool_version: v2.1.0
tool_checksums_sha256: 5517b5ec9872ad51546409de37b2932a90f230c673570998f8696416b149e5c6

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzComputeRoot$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzVerifyInclusion$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzVerifyConsistency$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzVerifyMultiInclusion$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseRoot$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseInclusionProof$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseConsistencyProof$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseMultiInclusionProof$'
        budget: 10000x
        count: 1
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseSnapshot$'
        budget: 10000x
        count: 1
        timeout: 2m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 20m
